name: Build desktop apps

# Builds Cadenza for Windows (installer + portable .exe), macOS (universal .dmg/.zip for Apple
# Silicon and Intel) and Linux (.AppImage/.deb). Every build is launched on its own OS before it
# is uploaded. Run from the Actions tab ("Run workflow"), or push a tag like v2.0.1 to publish a
# GitHub Release with direct download links.
#
# Optional Apple signing/notarization (removes the "unverified developer" prompt): add repository
# secrets MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release (tag v<desktop version>) with the builds'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Electron tooling
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run dist:win

      - name: Build (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: npm run dist:linux

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT" ]; then
            echo "Signing with Developer ID and notarizing"
            export CSC_LINK="$MAC_CERT" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            npm run prepare-app
            npx electron-builder --mac --publish never -c.mac.hardenedRuntime=true \
              -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.plist -c.mac.notarize=true
          else
            echo "No Apple certificate configured: ad-hoc signing (build/after-pack.js)"
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac
          fi

      - name: Verify macOS app (signature, architectures, DMG)
        if: runner.os == 'macOS'
        working-directory: desktop/dist
        run: |
          APP="mac-universal/Cadenza.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Cadenza" | tee /dev/stderr | grep -q "x86_64 arm64"
          DMG=$(ls *.dmg | head -1)
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/cadenza-dmg "$DMG"
          codesign --verify --deep --strict "/tmp/cadenza-dmg/Cadenza.app"
          ls "/tmp/cadenza-dmg"
          hdiutil detach /tmp/cadenza-dmg

      - name: Launch test (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop/dist
        run: |
          # simulate a browser download (quarantine flag) is not possible for the runner itself,
          # so launch the exact bundle that ships and require it to render the UI and run audio code
          CADENZA_SMOKE_TEST=1 "mac-universal/Cadenza.app/Contents/MacOS/Cadenza" 2>&1 | tee smoke.log
          grep -q SMOKE_OK smoke.log

      - name: Launch test (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop/dist
        run: |
          CADENZA_SMOKE_TEST=1 timeout 180 ./win-unpacked/Cadenza.exe > smoke.log 2>&1 || (cat smoke.log; exit 1)
          cat smoke.log
          echo "Windows app exited cleanly"

      - name: Launch test (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop/dist
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          CADENZA_SMOKE_TEST=1 xvfb-run -a ./linux-unpacked/cadenza-desktop --no-sandbox 2>&1 | tee smoke.log
          grep -q SMOKE_OK smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: cadenza-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*-mac-*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  web-package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/package-web.js
      - uses: actions/upload-artifact@v4
        with: { name: cadenza-web, path: dist/*.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build, web-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "name=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Cadenza ${{ steps.tag.outputs.name }}
          make_latest: true
          body: |
            ## What's new in 2.7
            * **Fingering guide:** a piano roll plus fretboard, keyboard or valves for every exercise and for the song melody in the Play-Along Studio — piano finger numbers (either hand), guitar/bass string, fret and finger, trumpet valves — with the recommended fingering and alternatives, following playback.
            * **Click patterns:** build your own metronome loop on a step grid (accent, click, soft, rest), with presets (clave, 6/8, 7/8, gap trainers), swing, tempo ramp, silent loops, saved patterns and shareable codes.
            * **Instrument courses:** 60 interactive lessons for piano, guitar, bass, trumpet and singing at all three levels, with play-it-now drills, fretboard/keyboard explorers and a valve simulator.
            * **Challenge Arena:** 66 creative challenges (22 per level) — ear duels, sprints, survival, rhythm tap-backs, melody memory, key and fretboard hunts, puzzles — with new questions every time.
            * **5-string bass:** choose 4 or 5 strings; fretboards, tuner, exercises and fingerings follow (low B included).
            * Songs now reopen reliably after Safari/iPad reloads the tab.

            ## What's new in 2.6
            * **Academy:** 53 self-paced lessons in 12 subjects — fundamentals, reading music, rhythm & groove, scales & keys, intervals, chords & harmony, ear training, songwriting, improvisation, worship band & arranging, how to practise, and your instrument. Each lesson explains the idea, gives real-world uses and examples to hear, shows it on your instrument, and has unlimited auto-generated practice questions (43 kinds) with stars and mastery, plus a placement quiz that tells you where to start.
            * **Music Toolkit:** chord dictionary (any root and type, guitar and piano, the keys it belongs to), scale finder with fret positions, interactive circle of fifths with playable progressions, chord-chart transposer and capo calculator, and an 80-term glossary (including Tamil/Carnatic terms).
            * **Practice Planner:** a balanced routine for your time and focus (balanced, technique, songs, theory, performance) with a guided timer for each block and a weekly tracker.
            * **Clearer pages:** Academy, Practice Room, Kids Zone, Play-Along Studio, Song Library, Rhythm & Metronome, Song Analyzer, Music Toolkit, Practice Planner, My Progress — grouped in the sidebar, with a "More" menu on phones. Home is now a learning hub.

            ## What's new in 2.5
            * **Harmony & part singing:** a six-step harmony path (what harmony is, holding a drone, singing in thirds, rounds, finding your part) and a part trainer for hymns — Doxology, Amazing Grace, Joyful Joyful, Silent Night, When the Saints, plus rounds — in four parts. Listen, hear your part alone, or sing it while Cadenza sings the others, with a scrolling four-colour score, the chord and each voice's chord tone, words, your live pitch line and an in-tune score.
            * **Smoother app:** page transitions that follow the direction you travel, cascading cards, tactile buttons and live chord-change pulses (all switched off by calm mode).
            * **Back & forward without glitches:** an in-app back/forward bar (and edge swipes in the installed app), scroll position remembered for every page, dialogs closed cleanly when you go back, a floating band control on song pages, and a friendly recovery card if a page ever fails.

            ## What's new in 2.4
            * **Worship song library:** Bethel Music, Hillsong and contemporary worship chord charts (practice arrangements — check the official chart for exact chords and words), public-domain hymns with words, and Tamil worship practice patterns (Keharwa, Thappu 6/8, ஆராதனை ballad, prayer song, carol, Carnatic colour) with பல்லவி / சரணம் sections.
            * **Song tutorials for guitar & piano:** strumming and finger-picking patterns, capo options, the hardest chord change, voice-led piano voicings with inversions, left/right-hand patterns, a step-by-step checklist, dynamics roadmap, and a matching drum groove. "Make my copy" lets teachers edit any chart or add words and PDFs.
            * **Kids & Focus (ADHD / autism-friendly):** 48 short lessons (rhythm, piano, guitar, singing) with one step at a time, colour-coded keys, tap-along and echo rhythms, high/low ear games, chord shapes, visual timers, today's plan (first-then), an "I need a break" button with breathing and movement breaks, read-aloud, gentle feedback, buddies and a sticker book.
            * **Themes & fonts:** 8 colour themes (incl. high contrast), light / dark / auto mode, Avenir Next (Nunito Sans where Avenir isn't installed), Atkinson Hyperlegible and Lexend for easier reading, larger text, wider spacing and calm mode.

            ## Also in 2.3
            * **Singing:** a new **Voice** instrument with 65 graded vocal exercises for your voice type (soprano → bass): breathing, lip trills, humming, sirens, five-note scales rising by semitones, arpeggios, octave leaps, messa di voce, agility runs, gospel & R&B riffs, harmony lines, solfege sight-singing, Carnatic sarali/janta varisai and sing-along melodies.
            * **Pitch trail & sing-along:** see your voice as a line against the melody (green in tune, amber close, red off), a karaoke mix that mutes the vocals, intonation scores per take (±cents, sharp/flat tendency) and vocal coaching from Cadi (breath, registers, pitch, vibrato, vocal health).
            * **7-instrument separation:** vocals, guitars & piano, pads & strings, bass, kick, snare and cymbals — with a Karaoke preset and "mute all drums".
            * **More accurate analysis:** better key detection (chord-aware), chord roots, major/minor, 7ths, inversions & voicings (e.g. C/E), chord-change timing, tempo, melody lines with passing notes, and strumming vs finger-picking detection — for audio, MIDI and guitar.
            * **Easier navigation:** song map (intro / verse / chorus), jump by section or chord, switch tracks from the Studio, and a floating mini transport while you scroll.

            * Also from 2.2: 70+ graded exercises per instrument with live play-along feedback and recorded takes, 41 keyboard-style rhythms with auto-accompaniment, beat maker, rhythm practice and the Cadi practice coach.

            ### Also in 2.1
            * Custom assignments with PDFs, record & send for review, teacher listening review, gospel/hymn song library (English, Tamil & any language), Learn modes, free Cloudflare Tunnel hosting.

            ## Download Cadenza

            | Your computer | File |
            | --- | --- |
            | **Windows** (installer) | `Cadenza-*-windows-setup.exe` |
            | **Windows** (no install) | `Cadenza-*-windows-portable.exe` |
            | **Mac** (Apple Silicon & Intel) | `Cadenza-*-mac-universal.dmg` |
            | **Linux** | `Cadenza-*-linux-x86_64.AppImage` or `.deb` |
            | **Any computer, no install** | `Cadenza-web-*.zip` (open `index.html` in Chrome/Edge) |

            **Mac, first launch:** drag Cadenza to Applications and open it. If macOS says it can't verify the developer,
            go to *System Settings → Privacy & Security* and click **Open Anyway** (once). Full steps are in the DMG.

            **Windows, first launch:** if SmartScreen appears, click **More info → Run anyway**.
          files: artifacts/*
