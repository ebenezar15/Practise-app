name: Publish web app (GitHub Pages)

# Publishes the Overture web app at https://<owner>.github.io/<repo>/ — open it in any browser,
# install it from there (Chrome/Edge: install icon; iPad/iPhone: Share → Add to Home Screen).
# Everything runs on the device; sign in to a classroom server (e.g. the desktop app's
# "Put online" https address) from Classroom to sync with a teacher.
on:
  workflow_dispatch:
  push:
    branches: ['claude/quirky-knuth-ugwj5h', 'main']
    paths: ['index.html', 'manifest.webmanifest', 'sw.js', 'css/**', 'js/**', 'vendor/**', 'icons/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the app files
        run: |
          mkdir site
          cp -r index.html manifest.webmanifest sw.js css js vendor icons site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
