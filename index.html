<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cadenza · AI Practice Coach</title>
  <meta name="description" content="Offline AI music practice coach for piano and guitar: real-time chord, timing, intonation and dynamics feedback, song analysis, strumming transcription, metronome, tuner and games.">
  <meta name="theme-color" content="#2a0f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cadenza">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // apply the saved theme before first paint (no flash of the default colours)
    try {
      var a = (JSON.parse(localStorage.getItem('cadenza.settings.v1') || '{}').appearance) || {}, d = document.documentElement;
      d.dataset.theme = a.theme || 'violet'; d.dataset.font = a.font || 'avenir'; d.dataset.text = a.text || 'md';
      d.dataset.spacing = a.spacing || 'normal'; d.dataset.calm = a.calm ? '1' : '0';
      d.dataset.mode = a.mode === 'dark' || (a.mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    } catch (e) { /* defaults */ }
  </script>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Cadenza needs JavaScript enabled.</noscript>

  <!-- Analysis engine (pure, offline) -->
  <script src="js/core/dsp.js"></script>
  <script src="js/core/theory.js"></script>
  <script src="js/core/instruments.js"></script>
  <script src="js/core/rhythm.js"></script>
  <script src="js/core/midi.js"></script>
  <script src="js/core/analyzer.js"></script>
  <script src="js/core/separation.js"></script>
  <script src="js/core/improv.js"></script>
  <script src="js/core/backing.js"></script>
  <script src="js/core/coach.js"></script>
  <script src="js/core/game.js"></script>
  <script src="js/core/syncmerge.js"></script>
  <script src="js/core/songs.js"></script>
  <script src="js/core/learn.js"></script>
  <script src="js/core/curriculum.js"></script>
  <script src="js/core/styles.js"></script>
  <script src="js/core/agent.js"></script>
  <script src="js/core/worship.js"></script>
  <script src="js/core/kids.js"></script>
  <script src="js/core/harmony.js"></script>
  <!-- Browser audio -->
  <script src="js/audio/audio.js"></script>
  <script src="js/audio/live.js"></script>
  <script src="js/audio/metronome.js"></script>
  <script src="js/audio/recorder.js"></script>
  <script src="js/audio/drums.js"></script>
  <!-- UI -->
  <script src="js/ui/components.js"></script>
  <script src="js/ui/install.js"></script>
  <script src="js/ui/docview.js"></script>
  <script src="js/ui/recordpanel.js"></script>
  <script src="js/ui/theme.js"></script>
  <script src="js/ui/pitchtrail.js"></script>
  <script src="js/ui/playalong.js"></script>
  <script src="js/ui/agent.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sync/sync.js"></script>
  <script src="js/views/shared.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/studio.js"></script>
  <script src="js/views/songs.js"></script>
  <script src="js/views/learn.js"></script>
  <script src="js/views/kids.js"></script>
  <script src="js/views/harmony.js"></script>
  <script src="js/views/insights.js"></script>
  <script src="js/views/games.js"></script>
  <script src="js/views/metronome.js"></script>

  <script>PM.App.start();</script>
</body>
</html>
